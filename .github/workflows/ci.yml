name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:11.8.9
        env:
          MARIADB_DATABASE: vega_test
          MARIADB_USER: vega_test
          MARIADB_PASSWORD: ci-only-password
          MARIADB_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://vega_test:ci-only-password@127.0.0.1:3306/vega_test
      TEST_DATABASE_URL: mysql://vega_test:ci-only-password@127.0.0.1:3306/vega_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run db:migrate:deploy
      - run: npm run db:check-schema
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:database
      - run: npm run build
      - run: npm run test:deployment
