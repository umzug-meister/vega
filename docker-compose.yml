services:
  db:
    image: mariadb:11.8.9
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-vega}
      MARIADB_USER: ${MYSQL_USER:-vega}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-vega_local_dev}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-vega_local_root_dev}
    volumes:
      - vega-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  vega-mariadb-data:
